services:
  db:
    image: postgres:16-alpine
    container_name: reloop-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ewaste}
      POSTGRES_USER: ${POSTGRES_USER:-ewaste}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    # Notice: No host ports exposed. PostgreSQL is only reachable by backend within the internal docker network.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reloop-backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-ewaste}
      DB_USER: ${POSTGRES_USER:-ewaste}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reloop-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
