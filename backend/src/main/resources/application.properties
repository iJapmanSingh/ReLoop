
spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ewaste}
spring.datasource.username=${DB_USER:ewaste}
spring.datasource.password=${DB_PASSWORD:ewaste}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-string-of-at-least-32-chars}
app.jwt.expiry-hours=24
